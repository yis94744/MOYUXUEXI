<h3 class="sec" id="s17"><span class="no">17</span>服务端部署：方案选型</h3>

<p class="lead">
  服务端怎么搭，取决于三件事：<strong>要什么协议、要不要精细权限、运维能力如何</strong>。
  这一节先把三条路线摊开对比，再手把手走一遍最常用的 <code class="ic">svnserve</code> 路线。
</p>

</svg>
  </div>
  <div class="cap">
    <b>决策建议：</b>内网小团队、追求省事 → <strong>svnserve</strong>；
    需要加密或对接域账号、公司有安全审计 → <strong>Apache</strong>；
    Windows 环境、没人愿意碰配置文件 → <strong>VisualSVN Server</strong>。
    三者可以共存（比如内网用 svnserve，外网出口用 Apache），仓库目录是同一份。
  </div>
