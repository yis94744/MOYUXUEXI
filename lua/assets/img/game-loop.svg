<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" width="660" height="340" role="img" aria-label="游戏主循环与帧内执行顺序">
  <defs>
    <linearGradient id="loopG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/><stop offset="50%" stop-color="#a21caf"/><stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <rect width="660" height="340" rx="16" fill="#f7f8fb"/>
  <rect width="660" height="340" rx="16" fill="none" stroke="#e0e5ef" stroke-width="1.5"/>

  <text x="30" y="42" fill="#12141c" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif"
        font-size="17" font-weight="800">游戏主循环：每一帧发生了什么</text>
  <text x="30" y="63" fill="#838c9e" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif"
        font-size="11.5">理解这张图，才能知道代码该写在哪一个阶段</text>

  <!-- 循环箭头背景 -->
  <rect x="30" y="84" width="600" height="150" rx="14" fill="#ffffff" stroke="#e0e5ef" stroke-width="1.5"/>

  <g font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif">
    <!-- 阶段块 -->
    <rect x="48" y="108" width="126" height="46" rx="9" fill="#7c3aed"/>
    <text x="111" y="128" fill="#fff" font-size="12" font-weight="800" text-anchor="middle">① 输入</text>
    <text x="111" y="144" fill="#ede9fe" font-size="9.5" text-anchor="middle">Input</text>

    <rect x="192" y="108" width="126" height="46" rx="9" fill="#9333ea"/>
    <text x="255" y="128" fill="#fff" font-size="12" font-weight="800" text-anchor="middle">② 逻辑更新</text>
    <text x="255" y="144" fill="#f3e8ff" font-size="9.5" text-anchor="middle">Update / Tick</text>

    <rect x="336" y="108" width="126" height="46" rx="9" fill="#c026d3"/>
    <text x="399" y="128" fill="#fff" font-size="12" font-weight="800" text-anchor="middle">③ 物理</text>
    <text x="399" y="144" fill="#fae8ff" font-size="9.5" text-anchor="middle">FixedUpdate</text>

    <rect x="480" y="108" width="132" height="46" rx="9" fill="#0891b2"/>
    <text x="546" y="128" fill="#fff" font-size="12" font-weight="800" text-anchor="middle">④ 渲染</text>
    <text x="546" y="144" fill="#cffafe" font-size="9.5" text-anchor="middle">Render</text>

    <!-- 箭头 -->
    <g stroke="#c8d1e0" stroke-width="2.4" fill="none" stroke-linecap="round">
      <path d="M178 131 H188"/>
      <path d="M322 131 H332"/>
      <path d="M466 131 H476"/>
    </g>
    <g fill="#c8d1e0">
      <path d="M188 127 l6 4 l-6 4 z"/>
      <path d="M332 127 l6 4 l-6 4 z"/>
      <path d="M476 127 l6 4 l-6 4 z"/>
    </g>

    <!-- 回环 -->
    <path d="M546 158 C546 192, 111 192, 111 158" stroke="#a21caf" stroke-width="2.2"
          fill="none" stroke-dasharray="6 5" opacity="0.7"/>
    <path d="M111 154 l-4.5 8 h9 z" fill="#a21caf" opacity="0.8"/>
    <text x="328" y="186" fill="#a21caf" font-size="10.5" font-weight="700"
          text-anchor="middle">下一帧 · 每秒重复 60 次（60 FPS）</text>
  </g>

  <!-- 下方关键提示 -->
  <g font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif">
    <rect x="30" y="248" width="292" height="72" rx="11" fill="#e0f7fb" stroke="#0891b2" stroke-width="1.2"/>
    <text x="46" y="270" fill="#0891b2" font-size="12" font-weight="800">Unity 对应</text>
    <text x="46" y="290" fill="#12141c" font-size="10.5">Update() 每帧调用，帧率可变</text>
    <text x="46" y="307" fill="#12141c" font-size="10.5">FixedUpdate() 固定时间步，物理在此</text>

    <rect x="338" y="248" width="292" height="72" rx="11" fill="#e6edff" stroke="#1d4ed8" stroke-width="1.2"/>
    <text x="354" y="270" fill="#1d4ed8" font-size="12" font-weight="800">Unreal 对应</text>
    <text x="354" y="290" fill="#12141c" font-size="10.5">Tick() 每帧调用，帧率可变</text>
    <text x="354" y="307" fill="#12141c" font-size="10.5">物理在 Tick 内推进，可开子步进</text>
  </g>
</svg>
