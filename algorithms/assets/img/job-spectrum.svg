<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 330" width="660" height="330" role="img" aria-label="游戏程序岗位光谱">
  <defs>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#22c55e"/>
      <stop offset="35%"  stop-color="#eab308"/>
      <stop offset="70%"  stop-color="#f97316"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>

  <rect width="660" height="330" rx="16" fill="#f7f8fb"/>
  <rect width="660" height="330" rx="16" fill="none" stroke="#e0e5ef" stroke-width="1.5"/>

  <text x="30" y="42" fill="#12141c" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif"
        font-size="17" font-weight="800">游戏程序岗位光谱</text>
  <text x="30" y="63" fill="#838c9e" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif"
        font-size="11.5">从左到右：技术深度递增，离玩家体验递减</text>

  <!-- 光谱条 -->
  <rect x="30" y="86" width="600" height="14" rx="7" fill="url(#spec)"/>
  <text x="34" y="82" fill="#22c55e" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif"
        font-size="10.5" font-weight="700">玩法向</text>
  <text x="560" y="82" fill="#e11d48" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif"
        font-size="10.5" font-weight="700">底层向</text>

  <g font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif">
    <!-- 卡1 玩法 -->
    <rect x="30" y="116" width="136" height="130" rx="11" fill="#ffffff"
          stroke="#22c55e" stroke-width="1.6"/>
    <rect x="30" y="116" width="136" height="5" rx="2.5" fill="#22c55e"/>
    <text x="46" y="146" fill="#12141c" font-size="13" font-weight="800">客户端 / 玩法</text>
    <text x="46" y="165" fill="#525a6b" font-size="10">需求量最大</text>
    <text x="46" y="184" fill="#525a6b" font-size="10">门槛最低</text>
    <text x="46" y="203" fill="#525a6b" font-size="10">正反馈最快</text>
    <rect x="46" y="215" width="104" height="20" rx="5" fill="#dcfce7"/>
    <text x="98" y="229" fill="#15803d" font-size="10" font-weight="700" text-anchor="middle">推荐入门</text>

    <!-- 卡2 技术美术 -->
    <rect x="178" y="116" width="136" height="130" rx="11" fill="#ffffff"
          stroke="#84cc16" stroke-width="1.6"/>
    <rect x="178" y="116" width="136" height="5" rx="2.5" fill="#84cc16"/>
    <text x="194" y="146" fill="#12141c" font-size="13" font-weight="800">技术美术 TA</text>
    <text x="194" y="165" fill="#525a6b" font-size="10">美术+程序+图形</text>
    <text x="194" y="184" fill="#525a6b" font-size="10">三者缺一不可</text>
    <text x="194" y="203" fill="#525a6b" font-size="10">最难招的岗位之一</text>
    <rect x="194" y="215" width="104" height="20" rx="5" fill="#ecfccb"/>
    <text x="246" y="229" fill="#4d7c0f" font-size="10" font-weight="700" text-anchor="middle">美术转技术优选</text>

    <!-- 卡3 服务器 -->
    <rect x="326" y="116" width="136" height="130" rx="11" fill="#ffffff"
          stroke="#eab308" stroke-width="1.6"/>
    <rect x="326" y="116" width="136" height="5" rx="2.5" fill="#eab308"/>
    <text x="342" y="146" fill="#12141c" font-size="13" font-weight="800">服务器 / 网络</text>
    <text x="342" y="165" fill="#525a6b" font-size="10">独立技能树</text>
    <text x="342" y="184" fill="#525a6b" font-size="10">并发与同步</text>
    <text x="342" y="203" fill="#525a6b" font-size="10">偏后端工程</text>
    <rect x="342" y="215" width="104" height="20" rx="5" fill="#fef9c3"/>
    <text x="394" y="229" fill="#a16207" font-size="10" font-weight="700" text-anchor="middle">后端转行友好</text>

    <!-- 卡4 图形 -->
    <rect x="474" y="116" width="156" height="130" rx="11" fill="#ffffff"
          stroke="#f97316" stroke-width="1.6"/>
    <rect x="474" y="116" width="156" height="5" rx="2.5" fill="#f97316"/>
    <text x="490" y="146" fill="#12141c" font-size="13" font-weight="800">图形 / 渲染</text>
    <text x="490" y="165" fill="#525a6b" font-size="10">线性代数必须熟</text>
    <text x="490" y="184" fill="#525a6b" font-size="10">矩阵推导要会</text>
    <text x="490" y="203" fill="#525a6b" font-size="10">技术壁垒最高</text>
    <rect x="490" y="215" width="124" height="20" rx="5" fill="#ffedd5"/>
    <text x="552" y="229" fill="#c2410c" font-size="10" font-weight="700" text-anchor="middle">高门槛高薪资</text>
  </g>

  <!-- 底部：引擎方向提示 -->
  <rect x="30" y="264" width="600" height="48" rx="11" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.2"/>
  <text x="46" y="285" fill="#7c3aed" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif"
        font-size="11.5" font-weight="800">引擎 / 工具程序</text>
  <text x="160" y="285" fill="#12141c" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif"
        font-size="10.5">读引擎源码、写编辑器工具、改构建流程 —— 需要 2–3 年经验打底，基本不招应届</text>
  <text x="46" y="302" fill="#7c3aed" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif"
        font-size="10" font-weight="600">Unreal 源码开放，是走这个方向的最佳土壤</text>
</svg>
