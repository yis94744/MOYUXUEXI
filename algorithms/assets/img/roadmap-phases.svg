<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" height="300" role="img" aria-label="游戏开发七阶段路线图">
  <defs>
    <linearGradient id="s1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="s2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0284c7"/></linearGradient>
    <linearGradient id="s3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f472b6"/><stop offset="100%" stop-color="#db2777"/></linearGradient>
    <linearGradient id="s4" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#d97706"/></linearGradient>
    <linearGradient id="s5" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#059669"/></linearGradient>
    <linearGradient id="s6" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#0891b2"/></linearGradient>
    <linearGradient id="s7" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#818cf8"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
  </defs>

  <rect width="660" height="300" rx="16" fill="#f7f8fb"/>
  <rect width="660" height="300" rx="16" fill="none" stroke="#e0e5ef" stroke-width="1.5"/>

  <text x="30" y="42" fill="#12141c" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif"
        font-size="17" font-weight="800">七阶段路线</text>
  <text x="30" y="63" fill="#838c9e" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif"
        font-size="11.5">从第一行代码到能独立发布游戏，约 12–24 个月</text>

  <g font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif" font-weight="800">
    <rect x="30"  y="196" width="70" height="54" rx="9" fill="url(#s1)"/>
    <text x="65"  y="219" fill="#fff" font-size="11.5" text-anchor="middle">P0 认知</text>
    <text x="65"  y="236" fill="#ede9fe" font-size="9.5" text-anchor="middle" font-weight="600">选引擎</text>

    <rect x="116" y="176" width="70" height="74" rx="9" fill="url(#s2)"/>
    <text x="151" y="201" fill="#fff" font-size="11.5" text-anchor="middle">P1 语言</text>
    <text x="151" y="218" fill="#e0f2fe" font-size="9.5" text-anchor="middle" font-weight="600">C# / C++</text>

    <rect x="202" y="156" width="70" height="94" rx="9" fill="url(#s3)"/>
    <text x="237" y="181" fill="#fff" font-size="11.5" text-anchor="middle">P2 数学</text>
    <text x="237" y="198" fill="#fce7f3" font-size="9.5" text-anchor="middle" font-weight="600">图形学</text>

    <rect x="288" y="126" width="70" height="124" rx="9" fill="url(#s4)"/>
    <text x="323" y="151" fill="#78350f" font-size="11.5" text-anchor="middle">P3 引擎</text>
    <text x="323" y="168" fill="#78350f" font-size="9.5" text-anchor="middle" font-weight="600">核心</text>

    <rect x="374" y="156" width="70" height="94" rx="9" fill="url(#s5)"/>
    <text x="409" y="181" fill="#fff" font-size="11.5" text-anchor="middle">P4 架构</text>
    <text x="409" y="198" fill="#d1fae5" font-size="9.5" text-anchor="middle" font-weight="600">优化网络</text>

    <rect x="460" y="176" width="70" height="74" rx="9" fill="url(#s6)"/>
    <text x="495" y="201" fill="#fff" font-size="11.5" text-anchor="middle">P5 发布</text>
    <text x="495" y="218" fill="#cffafe" font-size="9.5" text-anchor="middle" font-weight="600">多平台</text>

    <rect x="546" y="146" width="84" height="104" rx="9" fill="url(#s7)"/>
    <text x="588" y="171" fill="#fff" font-size="11.5" text-anchor="middle">P6 作品</text>
    <text x="588" y="188" fill="#e0e7ff" font-size="9.5" text-anchor="middle" font-weight="600">求职</text>
  </g>

  <path d="M26 256 H634" stroke="#c8d1e0" stroke-width="2" stroke-linecap="round"/>

  <!-- 趋势线 -->
  <path d="M55 168 C180 150, 360 92, 600 66" stroke="#7c3aed" stroke-width="2.2"
        fill="none" stroke-linecap="round" opacity="0.35" stroke-dasharray="5 5"/>

  <!-- 起终点 -->
  <circle cx="65" cy="268" r="4" fill="#7c3aed"/>
  <text x="76" y="272" fill="#838c9e" font-size="10.5"
        font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif">零基础起步</text>
  <circle cx="588" cy="268" r="4" fill="#4f46e5"/>
  <text x="490" y="272" fill="#838c9e" font-size="10.5"
        font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif">能独立发布</text>
</svg>
