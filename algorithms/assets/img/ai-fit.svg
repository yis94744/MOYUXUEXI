<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" width="660" height="420" role="img" aria-label="AI 在游戏开发各环节的适用程度">
  <defs>
    <linearGradient id="goodG" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#0d9488"/></linearGradient>
    <linearGradient id="midG"  x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#d97706"/><stop offset="100%" stop-color="#ea580c"/></linearGradient>
    <linearGradient id="badG"  x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#dc2626"/><stop offset="100%" stop-color="#be123c"/></linearGradient>
  </defs>

  <rect width="660" height="420" rx="16" fill="#f7f8fb"/>
  <rect width="660" height="420" rx="16" fill="none" stroke="#e0e5ef" stroke-width="1.5"/>

  <text x="30" y="40" fill="#12141c" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif"
        font-size="17" font-weight="800">AI 在各环节的实际可用度</text>
  <text x="30" y="61" fill="#838c9e" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif"
        font-size="11.5">关键不是「AI 强不强」，而是「这个环节错了代价多大」</text>

  <g font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif">
    <!-- 绿色区：好用 -->
    <rect x="30" y="80" width="600" height="96" rx="11" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
    <rect x="30" y="80" width="600" height="24" rx="11" fill="url(#goodG)"/>
    <rect x="30" y="94" width="600" height="10" fill="url(#goodG)"/>
    <circle cx="46" cy="92" r="6" fill="#ffffff"/>
    <path d="M43 92 l2.2 2.2 l4 -4.2" stroke="#059669" stroke-width="1.8" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="97" fill="#ffffff" font-size="11.5" font-weight="800">放心用 —— 错了立刻能发现，改起来成本低</text>

    <text x="46" y="126" fill="#12141c" font-size="11">样板代码与重复性实现</text>
    <text x="46" y="146" fill="#12141c" font-size="11">编辑器工具脚本、批处理</text>
    <text x="46" y="166" fill="#12141c" font-size="11">解释报错、查 API 用法</text>

    <text x="286" y="126" fill="#12141c" font-size="11">写单元测试与测试数据</text>
    <text x="286" y="146" fill="#12141c" font-size="11">代码注释与文档</text>
    <text x="286" y="166" fill="#12141c" font-size="11">正则、配置、数据转换</text>

    <text x="500" y="126" fill="#047857" font-size="10.5" font-weight="700">共同点：</text>
    <text x="500" y="144" fill="#047857" font-size="10.5">结果可验证</text>
    <text x="500" y="162" fill="#047857" font-size="10.5">不涉及运行时状态</text>

    <!-- 黄色区：谨慎 -->
    <rect x="30" y="188" width="600" height="96" rx="11" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
    <rect x="30" y="188" width="600" height="24" rx="11" fill="url(#midG)"/>
    <rect x="30" y="202" width="600" height="10" fill="url(#midG)"/>
    <circle cx="46" cy="200" r="6" fill="#ffffff"/>
    <path d="M46 196.5 v4.6" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
    <circle cx="46" cy="204.2" r="1.1" fill="#d97706"/>
    <text x="58" y="205" fill="#ffffff" font-size="11.5" font-weight="800">要审 —— 能省时间，但必须逐行核对</text>

    <text x="46" y="234" fill="#12141c" font-size="11">功能模块的初版实现</text>
    <text x="46" y="254" fill="#12141c" font-size="11">重构建议</text>
    <text x="46" y="274" fill="#12141c" font-size="11">性能优化思路</text>

    <text x="286" y="234" fill="#12141c" font-size="11">引擎 API 的具体写法</text>
    <text x="286" y="254" fill="#12141c" font-size="11">算法实现（需验边界）</text>
    <text x="286" y="274" fill="#12141c" font-size="11">着色器代码</text>

    <text x="500" y="234" fill="#b45309" font-size="10.5" font-weight="700">风险点：</text>
    <text x="500" y="252" fill="#b45309" font-size="10.5">版本过时</text>
    <text x="500" y="270" fill="#b45309" font-size="10.5">边界条件遗漏</text>

    <!-- 红色区：危险 -->
    <rect x="30" y="296" width="600" height="96" rx="11" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
    <rect x="30" y="296" width="600" height="24" rx="11" fill="url(#badG)"/>
    <rect x="30" y="310" width="600" height="10" fill="url(#badG)"/>
    <circle cx="46" cy="308" r="6" fill="#ffffff"/>
    <path d="M43.4 305.4 l5.2 5.2 M48.6 305.4 l-5.2 5.2" stroke="#dc2626" stroke-width="1.9"
          stroke-linecap="round"/>
    <text x="58" y="313" fill="#ffffff" font-size="11.5" font-weight="800">别交给它 —— 错了代价极大，且往往不会立刻暴露</text>

    <text x="46" y="342" fill="#12141c" font-size="11">整体架构设计</text>
    <text x="46" y="362" fill="#12141c" font-size="11">跨系统调试</text>
    <text x="46" y="382" fill="#12141c" font-size="11">致命性能问题定位</text>

    <text x="286" y="342" fill="#12141c" font-size="11">涉及运行时状态的问题</text>
    <text x="286" y="362" fill="#12141c" font-size="11">多线程与同步逻辑</text>
    <text x="286" y="382" fill="#12141c" font-size="11">内存生命周期管理</text>

    <text x="500" y="342" fill="#991b1b" font-size="10.5" font-weight="700">为什么危险：</text>
    <text x="500" y="360" fill="#991b1b" font-size="10.5">看起来对</text>
    <text x="500" y="378" fill="#991b1b" font-size="10.5">问题延迟爆发</text>
  </g>
</svg>
