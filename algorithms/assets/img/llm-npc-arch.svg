<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 460" width="660" height="460" role="img" aria-label="LLM 驱动 NPC 的架构与工程约束">
  <defs>
    <linearGradient id="per" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0891b2"/><stop offset="100%" stop-color="#0e7490"/></linearGradient>
    <linearGradient id="mem" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="llm" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#db2777"/><stop offset="100%" stop-color="#be185d"/></linearGradient>
    <linearGradient id="act" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
  </defs>

  <rect width="660" height="460" rx="16" fill="#f7f8fb"/>
  <rect width="660" height="460" rx="16" fill="none" stroke="#e0e5ef" stroke-width="1.5"/>

  <text x="30" y="40" fill="#12141c" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif"
        font-size="17" font-weight="800">LLM 驱动 NPC 的架构与硬约束</text>
  <text x="30" y="61" fill="#838c9e" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif"
        font-size="11.5">架构不难画，难的是让它在延迟、成本、一致性三条线内跑起来</text>

  <g font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif">
    <!-- 四步流程 -->
    <rect x="30" y="80" width="138" height="76" rx="10" fill="url(#per)"/>
    <text x="99" y="106" fill="#ffffff" font-size="12.5" font-weight="800" text-anchor="middle">① 感知</text>
    <text x="99" y="124" fill="#cffafe" font-size="9.5" text-anchor="middle">玩家输入 / 世界状态</text>
    <text x="99" y="140" fill="#cffafe" font-size="9.5" text-anchor="middle">附近的物体与事件</text>

    <rect x="182" y="80" width="138" height="76" rx="10" fill="url(#mem)"/>
    <text x="251" y="106" fill="#ffffff" font-size="12.5" font-weight="800" text-anchor="middle">② 记忆</text>
    <text x="251" y="124" fill="#ede9fe" font-size="9.5" text-anchor="middle">短期：对话历史摘要</text>
    <text x="251" y="140" fill="#ede9fe" font-size="9.5" text-anchor="middle">长期：向量库检索</text>

    <rect x="334" y="80" width="138" height="76" rx="10" fill="url(#llm)"/>
    <text x="403" y="106" fill="#ffffff" font-size="12.5" font-weight="800" text-anchor="middle">③ 推理</text>
    <text x="403" y="124" fill="#fce7f3" font-size="9.5" text-anchor="middle">LLM 生成决策 / 台词</text>
    <text x="403" y="140" fill="#fce7f3" font-size="9.5" text-anchor="middle">结构化输出约束</text>

    <rect x="486" y="80" width="144" height="76" rx="10" fill="url(#act)"/>
    <text x="558" y="106" fill="#ffffff" font-size="12.5" font-weight="800" text-anchor="middle">④ 行动</text>
    <text x="558" y="124" fill="#d1fae5" font-size="9.5" text-anchor="middle">动画 / 移动 / 对话</text>
    <text x="558" y="140" fill="#d1fae5" font-size="9.5" text-anchor="middle">交给行为树执行</text>

    <g stroke="#c8d1e0" stroke-width="2.2" fill="none">
      <path d="M170 118 H178"/><path d="M322 118 H330"/><path d="M474 118 H482"/>
    </g>
    <g fill="#c8d1e0">
      <path d="M178 114 l6 4 l-6 4 z"/><path d="M330 114 l6 4 l-6 4 z"/><path d="M482 114 l6 4 l-6 4 z"/>
    </g>

    <!-- 三条硬约束 -->
    <text x="30" y="192" fill="#12141c" font-size="12.5" font-weight="800">三条必须同时满足的线：</text>

    <!-- 延迟 -->
    <rect x="30" y="204" width="196" height="126" rx="11" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="30" y="204" width="196" height="5" rx="2.5" fill="#dc2626"/>
    <text x="44" y="230" fill="#dc2626" font-size="12" font-weight="800">延迟</text>
    <text x="44" y="252" fill="#12141c" font-size="10.5">云端推理 1–3 秒</text>
    <text x="44" y="270" fill="#525a6b" font-size="10">对话场景：可接受</text>
    <text x="44" y="288" fill="#dc2626" font-size="10" font-weight="700">实时战斗：完全不行</text>
    <text x="44" y="312" fill="#991b1b" font-size="9.5" font-style="italic">缓解：流式输出 / 预生成</text>
    <text x="44" y="325" fill="#991b1b" font-size="9.5" font-style="italic">小模型 / 本地推理</text>

    <!-- 成本 -->
    <rect x="240" y="204" width="196" height="126" rx="11" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <rect x="240" y="204" width="196" height="5" rx="2.5" fill="#d97706"/>
    <text x="254" y="230" fill="#b45309" font-size="12" font-weight="800">成本</text>
    <text x="254" y="252" fill="#12141c" font-size="10.5">每次对话都是 token 账单</text>
    <text x="254" y="270" fill="#525a6b" font-size="10">× 玩家数 × 每日轮次</text>
    <text x="254" y="288" fill="#b45309" font-size="10" font-weight="700">随用户量线性增长</text>
    <text x="254" y="312" fill="#92400e" font-size="9.5" font-style="italic">缓解：缓存 / 小模型路由</text>
    <text x="254" y="325" fill="#92400e" font-size="9.5" font-style="italic">限额 / 本地部署</text>

    <!-- 一致性 -->
    <rect x="450" y="204" width="180" height="126" rx="11" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="450" y="204" width="180" height="5" rx="2.5" fill="#7c3aed"/>
    <text x="464" y="230" fill="#6d28d9" font-size="12" font-weight="800">一致性</text>
    <text x="464" y="252" fill="#12141c" font-size="10.5">可能说错名字、道具</text>
    <text x="464" y="270" fill="#12141c" font-size="10.5">或编造世界观设定</text>
    <text x="464" y="288" fill="#6d28d9" font-size="10" font-weight="700">打破沉浸感</text>
    <text x="464" y="312" fill="#5b21b6" font-size="9.5" font-style="italic">缓解：RAG 检索设定</text>
    <text x="464" y="325" fill="#5b21b6" font-size="9.5" font-style="italic">结构化输出 + 校验</text>

    <!-- 底部：安全 -->
    <rect x="30" y="348" width="600" height="44" rx="11" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="6 4"/>
    <text x="44" y="368" fill="#dc2626" font-size="11.5" font-weight="800">安全（贯穿全流程）</text>
    <text x="44" y="384" fill="#12141c" font-size="10">玩家一定会尝试越狱、诱导 NPC 说脏话或生成不当内容 —— 必须有输入过滤 + 输出校验 + 兜底话术</text>

    <!-- 关键结论 -->
    <rect x="30" y="404" width="600" height="40" rx="10" fill="#fef3c7"/>
    <text x="330" y="420" fill="#92400e" font-size="11" font-weight="800" text-anchor="middle">
      工程结论：LLM 不应该直接驱动游戏行为
    </text>
    <text x="330" y="436" fill="#78350f" font-size="10" text-anchor="middle">
      让它做「决策与表达」，把「确定性执行」交给行为树 —— 这才是能上线的方式
    </text>
  </g>
</svg>
