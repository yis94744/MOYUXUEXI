<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" width="660" height="380" role="img" aria-label="Unreal Gameplay Framework 核心类关系">
  <defs>
    <linearGradient id="uegm" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#dc2626"/><stop offset="100%" stop-color="#b91c1c"/></linearGradient>
    <linearGradient id="uegs" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ea580c"/><stop offset="100%" stop-color="#c2410c"/></linearGradient>
    <linearGradient id="uepc" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0891b2"/><stop offset="100%" stop-color="#0e7490"/></linearGradient>
    <linearGradient id="uepa" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1d4ed8"/><stop offset="100%" stop-color="#4f46e5"/></linearGradient>
    <linearGradient id="ueps" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="uehud" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#db2777"/><stop offset="100%" stop-color="#be185d"/></linearGradient>
  </defs>

  <rect width="660" height="380" rx="16" fill="#f7f8fb"/>
  <rect width="660" height="380" rx="16" fill="none" stroke="#e0e5ef" stroke-width="1.5"/>

  <text x="30" y="40" fill="#12141c" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif"
        font-size="17" font-weight="800">Unreal Gameplay Framework</text>
  <text x="30" y="61" fill="#838c9e" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif"
        font-size="11.5">理解这套预设框架，才知道代码该写在哪个类里</text>

  <g font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif">
    <!-- 第一行：服务端专属 -->
    <rect x="30" y="84" width="290" height="86" rx="11" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <rect x="30" y="84" width="290" height="26" rx="11" fill="url(#uegm)"/>
    <rect x="30" y="100" width="290" height="10" fill="url(#uegm)"/>
    <text x="44" y="102" fill="#ffffff" font-size="12" font-weight="800">GameMode · 游戏规则</text>
    <text x="46" y="130" fill="#12141c" font-size="10.5">只在服务端存在</text>
    <text x="46" y="148" fill="#991b1b" font-size="10.5" font-weight="600">用什么 Pawn · 怎么算赢 · 玩家如何加入</text>
    <text x="46" y="164" fill="#7f1d1d" font-size="9.5" font-style="italic">客户端拿不到它的引用</text>

    <rect x="340" y="84" width="290" height="86" rx="11" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <rect x="340" y="84" width="290" height="26" rx="11" fill="url(#uegs)"/>
    <rect x="340" y="100" width="290" height="10" fill="url(#uegs)"/>
    <text x="354" y="102" fill="#ffffff" font-size="12" font-weight="800">GameState · 全局状态</text>
    <text x="356" y="130" fill="#12141c" font-size="10.5">全端都存在，自动复制给所有客户端</text>
    <text x="356" y="148" fill="#c2410c" font-size="10.5" font-weight="600">队伍分数 · 剩余时间 · 当前阶段</text>
    <text x="356" y="164" fill="#9a3412" font-size="9.5" font-style="italic">需要共享的信息放这里</text>

    <!-- 第二行：玩家 -->
    <rect x="30" y="186" width="186" height="100" rx="11" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
    <rect x="30" y="186" width="186" height="26" rx="11" fill="url(#uepc)"/>
    <rect x="30" y="202" width="186" height="10" fill="url(#uepc)"/>
    <text x="44" y="204" fill="#ffffff" font-size="12" font-weight="800">PlayerController</text>
    <text x="46" y="232" fill="#12141c" font-size="10.5">玩家的「意志」</text>
    <text x="46" y="250" fill="#0e7490" font-size="10">接收输入 → 转化为动作</text>
    <text x="46" y="268" fill="#155e75" font-size="9.5" font-style="italic">不参与碰撞，可独立存在</text>

    <rect x="228" y="186" width="186" height="100" rx="11" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
    <rect x="228" y="186" width="186" height="26" rx="11" fill="url(#uepa)"/>
    <rect x="228" y="202" width="186" height="10" fill="url(#uepa)"/>
    <text x="242" y="204" fill="#ffffff" font-size="12" font-weight="800">Pawn / Character</text>
    <text x="244" y="232" fill="#12141c" font-size="10.5">玩家在游戏中的「身体」</text>
    <text x="244" y="250" fill="#1d4ed8" font-size="10">Character 内置角色移动组件</text>
    <text x="244" y="268" fill="#1e3a8a" font-size="9.5" font-style="italic">行走/跳跃/下蹲/爬梯已实现</text>

    <rect x="426" y="186" width="204" height="100" rx="11" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
    <rect x="426" y="186" width="204" height="26" rx="11" fill="url(#ueps)"/>
    <rect x="426" y="202" width="204" height="10" fill="url(#ueps)"/>
    <text x="440" y="204" fill="#ffffff" font-size="12" font-weight="800">PlayerState · 玩家数据</text>
    <text x="442" y="232" fill="#12141c" font-size="10.5">单个玩家的公开数据</text>
    <text x="442" y="250" fill="#6d28d9" font-size="10">昵称 · 分数 · 击杀数</text>
    <text x="442" y="268" fill="#5b21b6" font-size="9.5" font-style="italic">每人一份，区别于 GameState</text>

    <!-- 底部 HUD -->
    <rect x="30" y="300" width="600" height="40" rx="11" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
    <rect x="30" y="300" width="6" height="40" rx="3" fill="url(#uehud)"/>
    <text x="48" y="318" fill="#be185d" font-size="12" font-weight="800">HUD / UMG · 界面显示层</text>
    <text x="48" y="333" fill="#12141c" font-size="10">传统 HUD 类做绘制；现代项目多用 UMG（Unreal Motion Graphics）做 UI</text>

    <!-- 底部提示 -->
    <rect x="30" y="350" width="600" height="22" rx="8" fill="#fef3c7"/>
    <text x="330" y="365" fill="#92400e" font-size="10.5" font-weight="700" text-anchor="middle">
      记忆口诀：GameMode 定规则 · GameState 记全局 · PlayerController 收输入 · PlayerState 存个人
    </text>
  </g>
</svg>
